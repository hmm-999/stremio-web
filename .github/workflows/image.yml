# Builds upstream's Dockerfile unchanged and publishes it for homelab-infra,
# which pins the digest. No SENTRY_DSN is passed, so the client's error
# reporting stays off.
#
# Every push to development is tagged development and sha-<commit>. A
# release is this commit cherry-picked onto an upstream release tag and
# tagged there; the tag keeps that commit alive:
#   git switch --detach v5.0.0-beta.40 && git cherry-pick <this commit>
#   git tag v5.0.0-beta.40-hmm.1 && git push origin v5.0.0-beta.40-hmm.1
#
# Each image gets a signed SLSA provenance attestation tying its digest to
# the commit and this workflow. Check one before pinning it:
#   gh attestation verify oci://ghcr.io/hmm-999/stremio-web@<digest> --owner hmm-999
name: Image

on:
  push:
    branches:
      - development
    tags:
      - "v*-hmm.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # Builds aren't byte-reproducible, so a release tag build and the
          # main build of the same commit differ; only branch builds write sha-<commit>.
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,enable=${{ github.ref_type == 'branch' }}
      # Path context so .git is included: webpack runs `git rev-parse HEAD`
      # for its cache-busting asset paths.
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # Storage records are an organization feature; this is a user account.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
